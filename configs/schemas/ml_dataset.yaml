name: ml_dataset
primary_key: [district_id, week_start_date]
columns:
  district_id: {dtype: string, required: true, nullable: false}
  district_name: {dtype: string, required: true, nullable: false}
  week_start_date: {dtype: date, required: true, nullable: false}
  week_end_date: {dtype: date, required: true, nullable: false}
  year: {dtype: integer, required: true, nullable: true}
  week: {dtype: integer, required: true, nullable: true, min: 1, max: 53}
  year_week: {dtype: string, required: true, nullable: true}
  month: {dtype: integer, required: true, nullable: false, min: 1, max: 12}
  quarter: {dtype: integer, required: true, nullable: false, min: 1, max: 4}
  dengue_cases: {dtype: integer, required: true, nullable: true, min: 0}
  cases_next_week: {dtype: integer, required: true, nullable: true, min: 0}
  cases_next_2w: {dtype: integer, required: true, nullable: true, min: 0}
  cases_next_4w: {dtype: integer, required: true, nullable: true, min: 0}
  row_quality_flag: {dtype: string, required: true, nullable: false}
  is_trainable: {dtype: boolean, required: true, nullable: false}
