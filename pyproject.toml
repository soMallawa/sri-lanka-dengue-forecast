[project]
name = "sri-lanka-dengue-forecast"
version = "1.0.0"
description = "Research code and guarded inference utilities for Sri Lanka dengue forecasting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "soMallawa" }]
dependencies = [
  "joblib==1.6.0",
  "lightgbm==4.7.0",
  "numpy==2.4.6",
  "pandas==3.0.6",
  "pyarrow==25.0.1",
  "scikit-learn==1.9.1",
  "scipy==1.17.1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
train = [
  "beautifulsoup4>=4.12",
  "h5netcdf>=1.3",
  "httpx>=0.27",
  "lxml>=5.0",
  "matplotlib>=3.11.2",
  "netCDF4>=1.6",
  "openpyxl>=3.1.5",
  "optuna>=5.0.0",
  "pandera>=0.20",
  "pdfplumber>=0.11.10",
  "polars>=1.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pymupdf>=1.28.2",
  "python-dateutil>=2.9",
  "PyYAML>=6.0",
  "requests==2.34.2",
  "shap>=0.51.0",
  "tenacity>=8.3",
  "tqdm>=4.66",
  "xarray>=2024.5",
  "xgboost-cpu>=3.2.0",
]
geospatial = [
  "geopandas==1.2.0",
  "pyogrio>=0.9",
  "rasterio==1.4.4",
  "rioxarray>=0.15",
  "shapely>=2.0",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
dengue-forecast = "dengue_forecast.cli:main"
dengue-forecast-predict = "dengue_forecast.public_inference:main"
dengue-forecast-train = "dengue_forecast.public_training:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dengue_forecast"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "dengue_forecast/_configs"
"src/dengue_forecast/model_manifest_trusted.json" = "dengue_forecast/model_manifest_trusted.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Explicit baseline: avoid inheriting a developer machine's global rule set.
select = ["E4", "E7", "E9", "F"]
