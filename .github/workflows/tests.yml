name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv pip install --system '.[dev]'
      - run: ruff check --config pyproject.toml src tests
      - run: python -m pytest tests
      - run: uv build --wheel
      - run: uv venv --system-site-packages .release-work/wheel-venv
      - run: uv pip install --python .release-work/wheel-venv/bin/python dist/*.whl --no-deps
      - run: cd .release-work && wheel-venv/bin/python -I -m dengue_forecast.public_inference list-models
